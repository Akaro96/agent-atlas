name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate kit
        shell: pwsh
        run: .\scripts\Validate-AgentWorkspaceKit.ps1
      - name: Validate markdown links
        shell: pwsh
        run: .\scripts\Validate-MarkdownLinks.ps1
      - name: Smoke tests
        shell: pwsh
        run: .\scripts\Invoke-KitSmokeTests.ps1
      - name: Scenario simulations
        shell: pwsh
        run: .\scripts\Invoke-KitScenarioSimulations.ps1
