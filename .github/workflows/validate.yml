name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate kit
        shell: pwsh
        run: .\scripts\Validate-AgentWorkspaceKit.ps1
      - name: Validate markdown links
        shell: pwsh
        run: .\scripts\Validate-MarkdownLinks.ps1
      - name: Smoke tests
        shell: pwsh
        run: .\scripts\Invoke-KitSmokeTests.ps1
      - name: Scenario simulations
        shell: pwsh
        run: .\scripts\Invoke-KitScenarioSimulations.ps1
